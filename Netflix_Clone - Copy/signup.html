<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clone – Sign Up</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <nav class="auth-nav">
    <a href="index.html" aria-label="Netflix Home">
      <img src="Images/logo.png" alt="Netflix" width="148" height="40">
    </a>
  </nav>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Sign Up</h1>
      <p class="auth-subtitle">Create your account to start watching.</p>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <input type="text" id="signup-name" class="form-input" placeholder=" " required autocomplete="name">
          <label for="signup-name" class="form-label">Demo Name</label>
          <span class="form-error" id="name-error"></span>
        </div>

        <div class="form-group">
          <input type="email" id="signup-email" class="form-input" placeholder=" " required autocomplete="email">
          <label for="signup-email" class="form-label">Demo Email address</label>
          <span class="form-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <input type="password" id="signup-password" class="form-input" placeholder=" " required autocomplete="new-password">
          <label for="signup-password" class="form-label">Demo Password (4+ characters)</label>
          <span class="form-error" id="password-error"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--xl auth-submit">Sign Up</button>

        <span class="form-error form-error--global" id="global-error"></span>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html" class="auth-link">Sign in.</a></p>
        <p class="auth-disclaimer">This is a frontend clone created for educational purposes only. 
No real user data is collected. <a href="#" class="auth-link">Learn more.</a></p>
      </div>
    </div>
  </main>

  <footer class="auth-page-footer">
    <p>Netflix Clone &copy; 2026</p>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/users.js"></script>
  <script src="js/auth.js"></script>
  <script>
    ;(() => {
      'use strict';
      const form      = $('#signup-form');
      const nameInput = $('#signup-name');
      const emailInput= $('#signup-email');
      const passInput = $('#signup-password');
      const globalErr = $('#global-error');

      // Pre-fill email from landing page
      const prefill = sessionStorage.getItem('netflix_prefill_email');
      if (prefill) {
        emailInput.value = prefill;
        sessionStorage.removeItem('netflix_prefill_email');
      }

      form.addEventListener('submit', e => {
        e.preventDefault();
        globalErr.textContent = '';

        const result = handleSignup(nameInput.value, emailInput.value, passInput.value);

        if (!result.success) {
          globalErr.textContent = result.message;
          return;
        }

        showToast(result.message, 'success');
        setTimeout(() => window.location.replace('browse.html'), 600);
      });

      // If already logged in, redirect
      if (isLoggedIn()) window.location.replace('browse.html');
    })();
  </script>
</body>
</html>
