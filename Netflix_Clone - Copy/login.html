<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clone – Sign In</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <nav class="auth-nav">
    <a href="index.html" aria-label="Netflix Home">
      <!-- <img src="Images/vectorseek.com-Netflix-Logo-Vector.png" alt="Netflix" width="148" height="40"> -->
    </a>
  </nav>

  <main class="auth-main">
    <div class="auth-card">
      <h1>Sign In</h1>

      <form id="login-form" novalidate>
        <div class="form-group">
          <input type="email" id="login-email" class="form-input" placeholder=" " required autocomplete="email">
          <label for="login-email" class="form-label">Email address</label>
          <span class="form-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <input type="password" id="login-password" class="form-input" placeholder=" " required autocomplete="current-password">
          <label for="login-password" class="form-label">Password</label>
          <span class="form-error" id="password-error"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--xl auth-submit">Sign In</button>

        <span class="form-error form-error--global" id="global-error"></span>

        <div class="auth-options">
          <label class="auth-remember">
            <input type="checkbox" checked> Remember me
          </label>
          <a href="#" class="auth-link">Need help?</a>
        </div>
      </form>

      <div class="auth-footer">
        <p>New to Netflix? <a href="signup.html" class="auth-link auth-link--bold">Sign up now.</a></p>
        <p class="auth-disclaimer">This page is protected by Google reCAPTCHA to ensure you're not a bot. <a href="#" class="auth-link">Learn more.</a></p>
      </div>

      <div class="auth-demo">
        <p><strong>Demo credentials:</strong></p>
        <p>Email: <code>test@netflix.com</code></p>
        <p>Password: <code>netflix123</code></p>
      </div>
    </div>
  </main>

  <footer class="auth-page-footer">
    <p>Netflix Clone &copy; 2026</p>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/users.js"></script>
  <script src="js/auth.js"></script>
  <script>
    ;(() => {
      'use strict';
      const form = $('#login-form');
      const emailInput = $('#login-email');
      const passInput  = $('#login-password');
      const emailErr   = $('#email-error');
      const passErr    = $('#password-error');
      const globalErr  = $('#global-error');

      form.addEventListener('submit', e => {
        e.preventDefault();
        emailErr.textContent = '';
        passErr.textContent = '';
        globalErr.textContent = '';

        const result = handleLogin(emailInput.value, passInput.value);

        if (!result.success) {
          globalErr.textContent = result.message;
          return;
        }

        showToast(result.message, 'success');
        setTimeout(() => window.location.replace('browse.html'), 600);
      });

      // If already logged in, redirect
      if (isLoggedIn()) window.location.replace('browse.html');
    })();
  </script>
</body>
</html>
